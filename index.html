<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio do dia · Quebra Nozes</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Bodoni+Moda:opsz,wght@6..96,400&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,500;6..12,600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FCF9F0; --wine:#682126; --olive:#656853; --ink:#2B2723; --line:#E4DFCF; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Nunito Sans", system-ui, sans-serif; }
  header { padding:18px 16px 6px; text-align:center; }
  header h1 { font-family:"GFS Didot", serif; color:var(--wine); font-weight:400; letter-spacing:.06em; margin:0; font-size:28px; }
  header p { margin:4px 0 0; color:var(--olive); font-size:14px; }
  main { max-width:1100px; margin:0 auto; padding:12px 14px 120px; display:grid; gap:18px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { main { grid-template-columns: 1fr 380px; align-items:start; } .preview { position:sticky; top:12px; } }
  main > * { min-width:0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; }
  .row { display:flex; align-items:center; gap:10px; }
  label.date { display:flex; gap:10px; align-items:center; font-weight:600; }
  input[type=date], input[type=text], input[type=number] { font:inherit; border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; color:var(--ink); }
  input[type=number] { width:78px; text-align:right; }
  .cat { margin-top:14px; }
  .cat-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .cat-head input.cat-name { font-family:"GFS Didot", serif; color:var(--wine); font-size:19px; flex:1 1 100%; min-width:0; border-color:transparent; padding-left:0; }
  .cat-head input.tag { flex:1; min-width:0; font-size:13px; padding:7px 9px; }
  .item { display:flex; gap:7px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line); }
  .item input[type=number] { width:62px; padding:9px 7px; }
  .item button.icon { padding:5px 7px; border-color:transparent; }
  .item input[type=checkbox] { width:26px; height:26px; accent-color:var(--wine); flex:none; }
  .item input.name { flex:1; min-width:0; border-color:transparent; padding-left:2px; }
  .item.off input.name { color:#a8a29a; text-decoration:line-through; }
  .item .rs { color:#8a847b; font-size:14px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer; }
  button.icon { padding:6px 9px; color:#8a847b; }
  button.primary { background:var(--wine); border-color:var(--wine); color:#fff; font-weight:600; padding:13px 18px; font-size:16px; }
  button.ghost { border-style:dashed; color:var(--olive); }
  .actions { position:fixed; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:rgba(252,249,240,.96); border-top:1px solid var(--line); display:flex; gap:10px; justify-content:center; z-index:5; }
  .actions button { flex:1; max-width:260px; }
  canvas { width:100%; height:auto; border-radius:10px; border:1px solid var(--line); display:block; background:var(--bg); }
  details { margin-top:14px; color:#6c665e; font-size:14px; }
  details .row { flex-wrap:wrap; margin-top:10px; }
  .hint { font-size:13px; color:#8a847b; margin:8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>CARDÁPIO DO DIA</h1>
  <p>Marque o que tem hoje, ajuste os preços e baixe a imagem.</p>
</header>

<main>
  <section class="card">
    <label class="date">Data <input type="date" id="date"></label>
    <div id="cats"></div>
    <div class="row" style="margin-top:14px"><button class="ghost" id="addCat">+ nova categoria</button></div>

    <details>
      <summary>Mais opções</summary>
      <div class="row">
        <button id="selectAll">Marcar tudo</button>
        <button id="selectNone">Desmarcar tudo</button>
        <button id="exportJson">Exportar catálogo (.json)</button>
        <label class="row" style="gap:6px"><button id="importBtn" type="button">Importar .json</button><input type="file" id="importFile" accept="application/json" hidden></label>
        <button id="reset">Voltar ao catálogo padrão</button>
      </div>
      <p class="hint">As alterações ficam salvas neste aparelho automaticamente. Para mudar o padrão para todo mundo, exporte o .json e substitua o <code>catalogo.json</code> do repositório.</p>
    </details>
  </section>

  <section class="preview">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <p class="hint" id="status"></p>
  </section>
</main>

<div class="actions">
  <button class="primary" id="download">Baixar PNG</button>
  <button class="primary" id="share" hidden>Compartilhar</button>
</div>

<script src="app.js"></script>
</body>
</html>
